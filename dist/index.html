<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusDirect</title>
  <link href="./style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<header class="bg-indigo-950 w-full shadow-md">
  <nav class="flex items-center justify-between px-8 py-4">
    <div class="flex items-center gap-2 text-white hover:text-violet-300 transition">
      <ion-icon name="bus-outline" class="text-3xl"></ion-icon>
      <span class="text-2xl font-bold text-white">BusDirect</span>
    </div>
    <div class="flex items-center gap-8">
      <a href="#reservation" class="text-white font-semibold hover:text-violet-300 transition">Réservation</a>
      <a href="#trajets" class="flex items-center gap-2 text-white hover:text-violet-300 transition">
        <ion-icon name="navigate-circle-outline" class="text-2xl"></ion-icon>
        <span class="text-white font-semibold hover:text-violet-300 transition">Direction</span>
      </a>
    </div>
  </nav>
</header>
<section class="mx-auto max-w-[90rem] rounded-2xl border border-blue-100 bg-white px-8 p-2 shadow-sm">
    <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-center">
        <div>
            <p class="mb-2 text-xs font-semibold tracking-wider text-blue-600"> VOTRE TRAJET</p>
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <h2 class="text-1xl font-extrabold text-[#0B1F4B]">Safi</h2>
                    <p class="text-xs text-slate-500">Départ</p>
                </div>
                <div class="flex items-center gap-2 text-blue-600">
                    <span class="h-px w-3 bg-blue-500"></span>
                    <ion-icon name="bus-outline" class="text-2xl"></ion-icon>
                    <span class="h-px w-3 bg-blue-500"></span>
                    <ion-icon name="arrow-forward-outline" class="text-xl"></ion-icon>
                </div>
                <div>
                    <h2 class="text-1xl font-extrabold text-[#0B1F4B]">Marrakech</h2>
                    <p class="text-xs text-slate-500">Destination</p>
                </div>
            </div>
        </div>

        <div class="mb-6 flex items-center justify-end gap-5 pr-6">
          <div class="flex items-center gap-2">
            <span class="h-3 w-3 rounded-full bg-green-300"></span>
            <span class="text-sm font-medium text-[#0B1F4B]">Libre</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="h-3 w-3 rounded-full bg-red-300"></span>
            <span class="text-sm font-medium text-[#0B1F4B]">Occupé</span>
          </div>
        </div>
    </div>
</section>


</body>
</html>
