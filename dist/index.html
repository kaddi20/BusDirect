<div class="flex items-center text-white gap-4 sm:gap-8">

<section id="trajet" class="mx-3 mt-1 rounded-2xl border border-slate-400 p-4 shadow-sm sm:mx-4 sm:p-5">
  <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-center">
    <div class="flex flex-col gap-2">
    <p class="text-xs font-semibold text-slate-500 ">Votre Trejet</p>

    <div class="flex flex-wrap items-center gap-1 sm:gap-2">
      <h2 class="text-lg font-bold text-slate-800 sm:text-xl">Safi</h2>
      <div class="flex items-center gap-1 text-slate-700 sm:gap-2">
        <span class="h-px w-3 bg-slate-800"></span>
        <ion-icon name="bus-outline" class="text-2xl"></ion-icon>
        <span class="h-px w-3 bg-slate-800"></span>
        <ion-icon name="arrow-forward-outline" class="text-1xl"></ion-icon>
      </div>

      <h2 class="text-lg font-bold text-slate-800 sm:text-xl">Marrakech</h2>
    </div>
  </div>
    <div class="flex flex-wrap items-center gap-4 sm:gap-6">
      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-green-300"></span>

      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-red-300"></span>
        <span class="text-sm font-bold text-slate-800 ">Occupé</span>
      </div>
    </div>
  </div>
</section>

  <!--réserver une place-->
  <div class="mt-2 w-full lg:w-[40%]">
   <div class="rounded-xl border border-slate-400 p-2 shadow-sm">
    <h2 class="text-xl font-bold text-slate-950">
     -  Reserver une place
    </h2>
    <form id="reservation-Form" class="flex flex-col gap-2">
      <div class="flex flex-col gap-2">
        <label for="nom" class="font-medium text-slate-700">
          passager
        </label>
        <input type="text" id="nom" placeholder="Entrez le nom du passager" class="w-full rounded-lg border border-slate-300 p-3">
      </div>
      <div class="grid grid-cols-[1fr_auto] items-end gap-2">
       <div class="flex flex-col gap-2">
        <label for="siege" class="font-medium text-slate-700">
          Siège sélectionné
        </label>

       <select id="siege" class="w-full rounded-lg border border-slate-300 bg-white p-3">
        <option value="">choiser un siège</option>
        <option value="01">Siège 01</option>
        <option value="02">Siège 02</option>
        <option value="03">Siège 03</option>
        <option value="04">Siège 04</option>
        <option value="05">Siège 05</option>
        <option value="06">Siège 06</option>
        <option value="07">Siège 07</option>
        <option value="08">Siège 08</option>
        <option value="09">Siège 09</option>
        <option value="10">Siège 10</option>
        <option value="11">Siège 11</option>
        <option value="12">Siège 12</option>
        <option value="13">Siège 13</option>
        <option value="14">Siège 14</option>
        <option value="15">Siège 15</option>
        <option value="16">Siège 16</option>
        <option value="17">Siège 17</option>
        <option value="18">Siège 18</option>
        <option value="19">Siège 19</option>
        <option value="20">Siège 20</option>
      </select>
      </div>
      <button type="submit" id="btn-conf" class="rounded-lg border border-slate-300 bg-slate-900 p-3 font-semibold text-white hover:bg-slate-800">
        confirmer la réservation
      </button>
      <!--message d'erreur ou succès-->
      <p id="message" class="hidden rounded-lg p-3 text-sm"></p>
      </div>
     </form>
   </div>
   <!--modification d'une réservation-->
    <div class="mt-2 w-full rounded-xl border border-slate-400 p-2">
     <h2 class="text-lg font-bold text-slate-950">
      - Modifier une réservation
     </h2>
     <form id="modification-Form" class="flex flex-col gap-2">
      <div class="flex flex-col gap-2">
        <label for="passager-existant" class="font-medium text-slate-700">
          Passager existants
        </label>
        <select id="passager-existant"class="w-full rounded-lg border border-slate-300 bg-white p-3">
          <option value="">Choisir un passager</option>
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label for="nv-nom" class="font-medium text-slate-700">
          Nom de passager
        </label>
        <input type="text" id="nv-nom" placeholder="modifier le nom" class="w-full rounded-lg border border-slate-300 p-2">
      </div>
      <div class="grid grid-cols-[1fr_auto] items-end gap-2">
       <div class="flex flex-col gap-2">
        <label for="nouveau-siege">
          Nouveau siège
        </label>
        <select id="nouveau-siege" class="w-full rounded-lg border border-slate-300 bg-white p-3">
          <option value="">les siéges</option>
        </select>
      </div>
      <div id="message-modification" class="hidden rounded-lg p-3 text-sm"></div>
      <button type="submit" id="btn-modifier" class="rounded-lg border border-slate-300 bg-slate-950 p-3 font-semibold text-white hover:bg-slate-800">
        Modifier
      </button>
     </div>
     </form>
  </div>
  <!--supprimer une réservation-->
  <div class="mt-2 rounded-xl border border-slate-400 p-2">
    <h2 class="text-lg font-bold text-slate-900">
     -  Supprimer une réservation
    </h2>
    <form id="suppression-Form">
      <div class="grid grid-cols-[1fr_auto] items-end gap-2">
        <div class="flex flex-col gap-2">
        <label for="passager-supprimer" class="font-medium text-slate-700">
          Passager réservé
        </label>
        <select id="passager-supprimer" class="w-full rounded-lg border border-slate-300 bg-white p-3">
          <option value="">Choisir un passager</option>
        </select>
      </div>
       <button type="submit" id="btn-supprimer" class="rounded-lg bg-red-600 p-3 font-semibold text-white hover:bg-red-700">
        Supprimer
       </button>
      </div>
    </form>
